spring:
  application:
    name: ppc-system

  datasource:
    url: jdbc:postgresql://localhost:5432/ppc_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # схему создаём через Flyway, а не через Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: "CHANGE_THIS_SECRET_KEY_TO_A_LONG_RANDOM_STRING_IN_PROD"
    expiration-ms: 86400000   # 24 часа
